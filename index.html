<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  h1 {
    color: #7ecfff;
    font-size: 2.8rem;
    font-weight: 700;
    font-family: 'Dancing Script', cursive;
    text-shadow:
      0 0 8px #4ab8ff,
      0 0 25px #2299ee,
      0 0 55px #0066cc;
    margin-bottom: 10px;
    animation: textPulse 2.5s ease-in-out infinite;
  }
  @keyframes textPulse {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; text-shadow: 0 0 15px #88ddff, 0 0 45px #44aaff, 0 0 80px #2277dd; }
  }
  canvas { display: block; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<h1>I Love You</h1>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = window.innerWidth;
const H = window.innerHeight * 0.78;
canvas.width = W;
canvas.height = H;

// ---- Генерируем частицы на поверхности объёмного сердца ----
// Идея: берём 2D сердце (x,y) как "скелет", добавляем глубину z через вращение по оси Y
// Формула 2D сердца: x = 16sin³(t), y = 13cos(t)-5cos(2t)-2cos(3t)-cos(4t)

const particles = [];
const NUM = 2500;

for (let i = 0; i < NUM; i++) {
  // Параметр вдоль контура сердца
  const t = Math.random() * Math.PI * 2;

  // 2D сердце
  const hx = 16 * Math.pow(Math.sin(t), 3);
  const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

  // Угол вращения вокруг оси Y (придаёт объём)
  const phi = Math.random() * Math.PI * 2;

  // Радиус "трубки" — толщина сердца
  // Трубка сужается у кончика (низ) и расширяется в середине
  const tubeR = (0.3 + 0.7 * Math.abs(Math.sin(t * 0.5))) * (2.0 + Math.random() * 0.5);

  const x3 = hx + Math.cos(phi) * tubeR;
  const y3 = hy + Math.sin(phi) * tubeR * 0.4; // плоскость Y чуть сжата
  const z3 = Math.sin(phi) * tubeR * 2.2;       // глубина

  const brightness = 0.35 + Math.random() * 0.65;
  const size = 0.4 + Math.random() * 1.6;

  particles.push({ ox: x3, oy: y3, oz: z3, brightness, size });
}

let angle = 0;
const CX = W / 2;
const CY = H / 2 - 10;
const SCALE = Math.min(W, H) * 0.028;

function render() {
  ctx.clearRect(0, 0, W, H);

  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);

  // Проецируем и сортируем
  const proj = [];
  for (const p of particles) {
    // Вращение вокруг оси Y
    const rx = p.ox * cosA - p.oz * sinA;
    const rz = p.ox * sinA + p.oz * cosA;
    const ry = p.oy;

    // Перспективная проекция
    const fov = 350;
    const depth = fov + rz * SCALE;
    if (depth <= 0) continue;

    const px = CX + (rx * SCALE * fov) / depth;
    const py = CY + (ry * SCALE * fov) / depth;

    // Глубина влияет на яркость (задние темнее)
    const depthBright = 0.4 + 0.6 * ((rz + 20) / 40);
    const bright = Math.min(1, Math.max(0, p.brightness * depthBright));

    proj.push({ px, py, rz, bright, size: p.size });
  }

  // Сортировка back→front
  proj.sort((a, b) => a.rz - b.rz);

  // Тень под сердцем
  const shadowY = CY + SCALE * 10;
  const sg = ctx.createRadialGradient(CX, shadowY, 0, CX, shadowY, SCALE * 6);
  sg.addColorStop(0, 'rgba(60,160,255,0.45)');
  sg.addColorStop(0.5, 'rgba(30,100,220,0.18)');
  sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.translate(CX, shadowY);
  ctx.scale(1, 0.2);
  ctx.translate(-CX, -shadowY);
  ctx.beginPath();
  ctx.arc(CX, shadowY, SCALE * 6, 0, Math.PI * 2);
  ctx.fillStyle = sg;
  ctx.fill();
  ctx.restore();

  // Рисуем частицы
  for (const p of proj) {
    if (!isFinite(p.px) || !isFinite(p.py)) continue;

    const rb = Math.round(90 + p.bright * 80);
    const gb = Math.round(160 + p.bright * 60);
    const glowSize = Math.max(0.5, p.size * 3);

    // Свечение
    try {
      const grd = ctx.createRadialGradient(p.px, p.py, 0, p.px, p.py, glowSize);
      grd.addColorStop(0, `rgba(${rb},${gb},255,${p.bright * 0.9})`);
      grd.addColorStop(0.5, `rgba(${rb},${gb},255,${p.bright * 0.3})`);
      grd.addColorStop(1, `rgba(${rb},${gb},255,0)`);
      ctx.beginPath();
      ctx.arc(p.px, p.py, glowSize, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
    } catch(e) {}

    // Ядро
    ctx.beginPath();
    ctx.arc(p.px, p.py, Math.max(0.3, p.size * 0.55), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${rb},${gb},255,${p.bright})`;
    ctx.fill();
  }

  angle += 0.013;
  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
